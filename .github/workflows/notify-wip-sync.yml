name: Notify WIP kit sync

on:
  push:
    branches: [main]
    paths:
      - "public/wiipo/**"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sync no AntX-Lab
        env:
          TOKEN: ${{ secrets.ANTX_LAB_DISPATCH_TOKEN }}
        run: |
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/anttonioagst/AntX-Lab/dispatches \
            -d '{"event_type":"wiipclub-deployed","client_payload":{"repo":"wiipclub","ref":"'"${{ github.sha }}"'"}}'
